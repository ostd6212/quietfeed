name: Scrape and Publish

on:
  schedule:
    # Four overnight passes (00/02/04/06 UTC = 02/04/06/08 CEST) instead of
    # one -- each pass clears up to MAX_NEW_JOBS_PER_RUN more of whatever
    # the previous pass couldn't finish, so a busy night has three more
    # chances to fully drain the backlog before an 08:00 CEST / 07:00 CET
    # morning check. No daytime runs: the goal is "ready by morning," not
    # intra-day freshness.
    - cron: "0 0,2,4,6 * * *"
  workflow_dispatch: {}

concurrency:
  group: job-radar-run
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE }}
        run: python run.py

      - name: Commit updated job data
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add data/jobs.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update job data [skip ci]"
          if ! git push origin HEAD:main; then
            echo "::warning::Push rejected, probably a concurrent run already pushed jobs.json -- this run's new scores will be redone next scheduled run"
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
